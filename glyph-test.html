<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Glyph test</title>
<style>body{background:#111;margin:20px;display:flex;flex-wrap:wrap;gap:8px}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/opentype.js/dist/opentype.min.js"></script>
<script>
const chars = Array.from('MatiasJansen,Designer🔥🎉✨💀🌊')
const RENDER_SIZE = 128
const DISPLAY_SIZE = 128

fetch('/fonts/OtherSans-Regular.woff')
  .then(r => r.arrayBuffer())
  .then(buf => {
    const font = opentype.parse(buf)
    chars.forEach(char => {
      const isEmoji = /\p{Emoji}/u.test(char)

      const gc = document.createElement('canvas')
      gc.width = RENDER_SIZE
      gc.height = RENDER_SIZE
      gc.title = char
      gc.style.width = `${DISPLAY_SIZE}px`
      gc.style.height = `${DISPLAY_SIZE}px`
      gc.style.border = '1px solid #444'
      const gctx = gc.getContext('2d')

      if (isEmoji) {
        gctx.font = `${RENDER_SIZE * 0.7}px serif`
        gctx.textAlign = 'center'
        gctx.textBaseline = 'middle'
        gctx.fillText(char, RENDER_SIZE / 2, RENDER_SIZE / 2)
      } else {
        const glyph = font.charToGlyph(char.toUpperCase())
        const size = RENDER_SIZE
        const path = glyph.getPath(0, 0, size)
        const bb = glyph.getBoundingBox()
        const scale = size / font.unitsPerEm
        const renderOffset = {
          x: (bb.x1 + bb.x2) / 2 * scale,
          y: -(bb.y1 + bb.y2) / 2 * scale,
        }
        gctx.fillStyle = 'white'
        gctx.save()
        gctx.translate(RENDER_SIZE / 2, RENDER_SIZE / 2)
        gctx.translate(-renderOffset.x, -renderOffset.y)
        gctx.fill(new Path2D(path.toPathData(4)), 'evenodd')
        gctx.restore()
      }

      const label = document.createElement('div')
      label.style.cssText = 'color:#888;font:9px monospace;text-align:center'
      label.textContent = char === ' ' ? 'SPC' : char
      const wrap = document.createElement('div')
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:2px'
      wrap.append(gc, label)
      document.body.appendChild(wrap)
    })
  })
</script>
</body>
</html>
